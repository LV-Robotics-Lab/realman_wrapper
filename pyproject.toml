[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "realman-wrapper"
version = "0.1.0"
description = "Fail-closed, backend-neutral wrapper for RealMan RM75 hardware"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "LV Robotics Lab" }]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8,<9", "ruff>=0.9,<1"]

[project.scripts]
realman-wrapper = "realman_wrapper.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/realman_wrapper"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
